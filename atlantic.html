<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Atlantic | Atlantic Coast Tours</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --bot-bubble: #334155;
      --user-bubble: #0284c7;
      --border: #475569;
      --error-bg: #7f1d1d;
      --error-text: #fecaca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .chat-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      width: 100%;
      max-width: 600px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      background-color: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    header p {
      font-size: 0.85rem;
      color: var(--accent);
    }

    .messages {
      flex: 1;
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .bubble-wrapper.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .bubble-wrapper.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 0.85rem 1.15rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .user .bubble {
      background-color: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 0.25rem;
    }

    .bot .bubble {
      background-color: var(--bot-bubble);
      color: var(--text-main);
      border-bottom-left-radius: 0.25rem;
    }

    .bot.error .bubble {
      background-color: var(--error-bg);
      color: var(--error-text);
    }

    .timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      padding: 0 0.25rem;
    }

    .input-area {
      padding: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      background-color: rgba(15, 23, 42, 0.3);
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div>
        <h1>Ask Atlantic</h1>
        <p>Atlantic Coast Tours Assistant</p>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="bubble-wrapper bot">
        <div class="bubble">
          Hello! Welcome to Atlantic Coast Tours. Ask me anything about our live tour catalogue!
        </div>
      </div>
    </div>

    <form class="input-area" id="chat-form">
      <input type="text" id="user-input" placeholder="Ask about tours, prices, availability..." autocomplete="off" required>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";
    const API_URL = "https://luas-class.kluxy.app/chat";
    const SYSTEM_PROMPT = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

    const messagesContainer = document.getElementById("messages");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(role, text, timestamp = null, isError = false) {
      const wrapper = document.createElement("div");
      wrapper.classList.add("bubble-wrapper", role);
      if (isError) wrapper.classList.add("error");

      const bubble = document.createElement("div");
      bubble.classList.add("bubble");
      bubble.textContent = text;
      wrapper.appendChild(bubble);

      if (timestamp) {
        const timeEl = document.createElement("div");
        timeEl.classList.add("timestamp");
        timeEl.textContent = `Data fetched live at ${timestamp}`;
        wrapper.appendChild(timeEl);
      }

      messagesContainer.appendChild(wrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return wrapper;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = userInput.value.trim();
      if (!question) return;

      appendMessage("user", question);
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      const thinkingWrapper = appendMessage("bot", "Thinking...");

      try {
        const csvResponse = await fetch(CSV_URL);
        if (!csvResponse.ok) {
          throw new Error(`Failed to fetch tour data (Status ${csvResponse.status})`);
        }
        const csvData = await csvResponse.text();
        const fetchTime = new Date().toLocaleTimeString();

        const apiResponse = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            system: SYSTEM_PROMPT,
            messages: [
              {
                role: "user",
                content: "Live data (CSV):\n" + csvData + "\n\nCustomer question: " + question
              }
            ]
          })
        });

        if (!apiResponse.ok) {
          throw new Error(`API Error (Status ${apiResponse.status})`);
        }

        const data = await apiResponse.json();
        messagesContainer.removeChild(thinkingWrapper);
        appendMessage("bot", data.reply || "No reply received.", fetchTime);

      } catch (err) {
        messagesContainer.removeChild(thinkingWrapper);
        appendMessage("bot", `Error: ${err.message}`, null, true);
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>

</body>
</html>
